name: Coletar notícias

on:
  schedule:
    # a cada 2 horas, das 6h às 22h (horário de Brasília = UTC-3)
    - cron: "17 9-23/2,1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar
        run: python -m oeste.collect
      - name: Salvar dados no repositório
        run: |
          git config user.name "oeste-em-pauta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Coleta de notícias $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            git pull --rebase
            git push
          fi
